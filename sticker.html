<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raghib weds Noor — Door stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #6e1826;
    --ink: #2a1214;
    --paper: #f4efe8;
    --card: #fffdfb;
    --muted: #8a7368;
    --gold: #e7c56a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: Outfit, system-ui, sans-serif; }
  .toolbar { max-width: 820px; margin: 0 auto; padding: 22px 18px 8px; }
  .toolbar h1 {
    margin: 0 0 6px; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 36px; font-weight: 600; letter-spacing: -.02em;
  }
  .toolbar p { margin: 0 0 14px; color: #6f564c; font-size: 16px; line-height: 1.4; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .actions a {
    appearance: none; border: 1.5px solid var(--wine); cursor: pointer; text-decoration: none;
    background: transparent; color: var(--wine); font-family: Outfit, sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 999px;
  }
  .actions button { background: var(--wine); color: #fff; }

  .sheets {
    max-width: 820px; margin: 0 auto; padding: 16px 14px 48px;
    display: grid; gap: 14px;
  }
  .sticker {
    background: var(--card);
    border: 3px solid var(--wine);
    min-height: 280px;
    padding: 8px;
    display: flex; flex-direction: column;
    break-inside: avoid;
    position: relative;
  }
  .frame {
    flex: 1; display: flex; flex-direction: column;
    border: 1.5px solid #c6a15a;
    padding: 14px 16px 12px;
    position: relative;
    background:
      radial-gradient(120px 80px at 0 0, rgba(198,161,90,.16), transparent 70%),
      radial-gradient(120px 80px at 100% 100%, rgba(110,24,38,.06), transparent 70%);
  }
  .corner {
    position: absolute; width: 46px; height: 46px; color: #b9924a; pointer-events: none;
  }
  .corner.tl { top: 6px; left: 6px; }
  .corner.tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .corner.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
  .corner.br { bottom: 6px; right: 6px; transform: scale(-1); }
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: relative; z-index: 1;
  }
  .brand {
    margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .12em;
    text-transform: none; color: var(--wine);
  }
  .brand .weds {
    font-size: .62em; font-weight: 500; letter-spacing: .04em;
    text-transform: lowercase; padding: 0 1px;
  }
  .room {
    margin: 0; width: 92px; height: 92px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2.5px solid var(--wine);
    box-shadow: 0 0 0 4px #fffdfb, 0 0 0 6px #c6a15a;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 40px; font-weight: 700; line-height: 1; color: var(--wine);
    background: transparent; flex: none;
  }
  .rule {
    height: 1px; margin: 10px 28px 0; position: relative; z-index: 1;
    background: linear-gradient(90deg, transparent, #c6a15a 15%, #c6a15a 85%, transparent);
  }
  .rule:before, .rule:after {
    content: ""; position: absolute; top: -4px; width: 9px; height: 9px;
    border: 1.5px solid #c6a15a; transform: rotate(45deg); background: #fffdfb;
  }
  .rule:before { left: 18%; }
  .rule:after { right: 18%; }
  .crown {
    width: 42px; height: 28px; margin: 8px auto 0; color: #b9924a; position: relative; z-index: 1;
  }
  .guests {
    list-style: none; margin: 0; padding: 8px 8px 0;
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 1;
  }
  .guests li {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 700; line-height: .92; letter-spacing: -.025em;
    font-size: clamp(58px, 11vw, 96px); color: var(--ink);
  }
  .guests.two li { font-size: clamp(46px, 8vw, 72px); }
  .guests.three li { font-size: clamp(36px, 6vw, 52px); }
  .guests.long li { font-size: clamp(40px, 6.6vw, 60px); }
  .under {
    list-style: none; margin: 8px 0 0; padding: 0;
    position: relative; z-index: 1;
  }
  .under li {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600; font-size: clamp(26px, 4.6vw, 36px);
    line-height: 1.05; color: var(--wine);
  }
  .foot {
    margin: 6px 0 2px; font-size: 13px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: var(--wine);
    position: relative; z-index: 1;
  }
  .sticker.papa .foot {
    font-family: "Great Vibes", cursive; font-weight: 400;
    font-size: 42px; letter-spacing: 0; text-transform: none; line-height: .8;
    margin-left: 36px;
  }

  .sticker.bridal {
    background: #8d1530;
    border: 1.5px solid #e8c56d;
    color: #fff8ef;
    min-height: 300px;
    padding: 18px 22px 16px;
  }
  .sticker.bridal .brand,
  .sticker.bridal .foot { color: rgba(255, 244, 220, .78); }
  .sticker.bridal .room {
    width: auto; height: auto; border: 0; box-shadow: none; border-radius: 0;
    background: none; color: var(--gold); font-size: 48px;
  }
  .sticker.bridal .guests li { color: #fff8ef; }
  .sticker.bridal .guests.two li { font-size: clamp(40px, 6.4vw, 62px); }
  .dulhan {
    margin: 10px 0 0; font-family: "Great Vibes", cursive;
    font-size: clamp(40px, 6.5vw, 58px); line-height: .85; color: var(--gold);
  }

  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    .toolbar { display: none !important; }
    body { background: #fff; }
    .sheets { display: block; max-width: none; padding: 0; }
    .sticker {
      width: 194mm; height: 136mm; min-height: 0;
      margin: 0 0 6mm; padding: 10mm 12mm 8mm;
      box-shadow: none;
      break-inside: avoid; page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .sticker:nth-child(2n) { margin-bottom: 0; page-break-after: always; }
    .sticker:last-child { page-break-after: auto; }
    .brand { font-size: 14pt; }
    .room { width: 24mm; height: 24mm; font-size: 26pt; }
    .sticker.bridal .room { width: auto; height: auto; font-size: 36pt; }
    .sticker.bridal .guests.two li { font-size: 46pt; }
    .guests { padding-top: 2mm; }
    .guests li { font-size: 78pt; }
    .guests.two li { font-size: 52pt; }
    .guests.three li { font-size: 36pt; }
    .guests.long li { font-size: 44pt; }
    .under li { font-size: 20pt; }
    .sticker.papa .foot { font-size: 32pt; }
    .dulhan { font-size: 36pt; }
    .foot { font-size: 11pt; }
    .sticker.bridal { min-height: 0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <h1>Door stickers</h1>
  <p>Open plates. The name fills the card, two per A4. Shagufta, Shaheena, and Rehana Begum are excluded.</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print stickers</button>
    <a href="/rooms">Room board</a>
    <a href="/barat">Going</a>
    <a href="/return">Return</a>
  </div>
</div>
<div class="sheets" id="sheets"></div>
<script>
const SKIP = new Set(["Shagufta", "Shaheena", "Rehana Begum"]);
const ROOMS = [
  { n: "504", people: ["Raghib Najmi", "Afifa Noor"], bridal: true },
  { n: "503", people: ["Taazeem Najmi"] },
  { n: "502", people: ["Aminul Huda Ansari"], below: ["P Papa", "Choti Ammi"] },
  { n: "501", people: ["Shakil Ahmed"], below: ["Bade Mama", "Badi Mami"] },
  { n: "500", people: ["Aqil Ahmed"], below: ["Chote Mama", "Choti Mami"] },
  { n: "404", people: ["Aman Dev", "Sayem Kalim"] },
  { n: "403", people: ["Md Kamil Khan", "Rahbar Shifat Urf Golden"] },
  { n: "402", people: ["Rooman Alam", "Abu Noman Khan"] },
  { n: "401", people: ["Masood Raghib", "Ashif Alam"] },
  { n: "400", people: ["Kashif Ashiqui", "Shazi (Ayan Kumar)", "Salman"] },
  { n: "304", people: ["Salhaddin", "Quiser Imam"] },
  { n: "303", people: ["Aziz Huda", "Parwez Alam"] },
  { n: "302", people: ["Zainul Abadeen", "Tabish Hayat"] },
  { n: "301", people: ["Md Nasim", "Soeb Raza"] },
  { n: "300", people: ["Faisal Shakeel", "Faizan Ahmed"] },
  { n: "204", people: ["Tabrez Hayat", "Minhajul Abeden"] },
  { n: "203", people: ["Sajidul Huda", "Imranul Huda"] },
  { n: "202", people: ["Shahwaz Anis", "Anwar Ul Haque"] },
  { n: "201", people: ["Mohd Alam", "Manahil Alam"] },
  { n: "200", people: ["Fahim Huda", "Sajiadul Arfan"] },
  { n: "104", people: ["Najmul Huda", "Israr Rafique"], king: true },
  { n: "103", people: ["Mumtaz Uncle", "Farghab Saud"] },
  { n: "102", people: ["Manir Huda", "Mazhar Hussain"] },
  { n: "101", people: ["Zia Ashraf", "Tanweer Asraf"] },
  { n: "100", people: ["Samo Uncle", "Owais Uncle"] },
  { n: "001", people: ["Modassir Barkat", "Sarwar Alam", "Md Seraj"] }
].map(r => ({ ...r, people: r.people.filter(p => !SKIP.has(p)) }))
 .filter(r => r.people.length);

function foot(r) {
  if (r.bridal) return "15 November 2026";
  if (r.papa) return "Papa";
  if (r.king) return "Father of the Groom";
  return "Baraat stay";
}
function sizeClass(r) {
  if (r.people.some(p => p.length > 16)) return "long";
  if (r.people.length > 2) return "three";
  if (r.people.length === 2) return "two";
  return "one";
}

const corner = `
<svg class="corner" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <path d="M6 46 Q6 6 46 6" stroke="currentColor" stroke-width="2"/>
  <path d="M14 46 Q14 14 46 14" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
</svg>`;
const crown = `<svg class="crown" viewBox="0 0 64 40" fill="currentColor" aria-hidden="true"><path d="M6 34h52l-4-18-12 10L32 6 22 26 10 16 6 34z"/></svg>`;

document.getElementById("sheets").innerHTML = ROOMS.map(r => {
  const names = r.people.map(p => `<li>${p}</li>`).join("");
  const under = (r.below || []).map(p => `<li>${p}</li>`).join("");
  const cls = ["sticker", r.bridal ? "bridal" : "", r.papa ? "papa" : "", r.king ? "king" : ""].filter(Boolean).join(" ");
  if (r.bridal) {
    return `
    <article class="${cls}">
      <div class="top">
        <p class="brand">RAGHIB <span class="weds">weds</span> NOOR</p>
        <p class="room">${r.n}</p>
      </div>
      <p class="dulhan">Dulhan Kamra</p>
      <ul class="guests ${sizeClass(r)}">${names}</ul>
      ${under ? `<ul class="under">${under}</ul>` : ""}
      <p class="foot">${foot(r)}</p>
    </article>`;
  }
  return `
  <article class="${cls}">
    <div class="frame">
      ${corner.replace('class="corner"', 'class="corner tl"')}
      ${corner.replace('class="corner"', 'class="corner tr"')}
      ${corner.replace('class="corner"', 'class="corner bl"')}
      ${corner.replace('class="corner"', 'class="corner br"')}
      <div class="top">
        <p class="brand">RAGHIB <span class="weds">weds</span> NOOR</p>
        <p class="room">${r.n}</p>
      </div>
      <div class="rule"></div>
      ${r.king ? crown : ""}
      <ul class="guests ${sizeClass(r)}">${names}</ul>
      ${under ? `<ul class="under">${under}</ul>` : ""}
      <p class="foot">${foot(r)}</p>
    </div>
  </article>`;
}).join("");
</script>
</body>
</html>
