<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor weds Raghib — Door stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #6e1826;
    --ink: #2a1214;
    --paper: #f4efe8;
    --card: #fffdfb;
    --muted: #8a7368;
    --gold: #e7c56a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: Outfit, system-ui, sans-serif; }
  .toolbar { max-width: 820px; margin: 0 auto; padding: 22px 18px 8px; }
  .toolbar h1 {
    margin: 0 0 6px; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 36px; font-weight: 600; letter-spacing: -.02em;
  }
  .toolbar p { margin: 0 0 14px; color: #6f564c; font-size: 16px; line-height: 1.4; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .actions a {
    appearance: none; border: 1.5px solid var(--wine); cursor: pointer; text-decoration: none;
    background: transparent; color: var(--wine); font-family: Outfit, sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 999px;
  }
  .actions button { background: var(--wine); color: #fff; }

  .sheets {
    max-width: 820px; margin: 0 auto; padding: 16px 14px 48px;
    display: grid; gap: 14px;
  }
  .sticker {
    background: var(--card);
    border: 1.5px solid var(--wine);
    min-height: 250px;
    padding: 18px 22px 16px;
    display: flex; flex-direction: column;
    break-inside: avoid;
  }
  .top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .brand {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
  }
  .room {
    margin: 0; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 28px; font-weight: 700; line-height: 1; color: var(--wine);
  }
  .guests {
    list-style: none; margin: 0; padding: 18px 0 8px;
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }
  .guests li {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 700; line-height: .96; letter-spacing: -.02em;
    font-size: clamp(46px, 8vw, 76px); color: var(--ink);
  }
  .guests.two li { font-size: clamp(40px, 6.4vw, 62px); }
  .guests.three li { font-size: clamp(32px, 5vw, 46px); }
  .guests.long li { font-size: clamp(34px, 5.2vw, 52px); }
  .foot {
    margin: 8px 0 0; font-size: 12px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  }

  .sticker.bridal {
    background: #8d1530;
    border-color: #e8c56d;
    color: #fff8ef;
    min-height: 300px;
  }
  .sticker.bridal .brand,
  .sticker.bridal .foot { color: rgba(255, 244, 220, .78); }
  .sticker.bridal .room { color: var(--gold); }
  .sticker.bridal .guests li { color: #fff8ef; }
  .dulhan {
    margin: 14px 0 0; font-family: "Great Vibes", cursive;
    font-size: clamp(42px, 7vw, 64px); line-height: .8; color: var(--gold);
  }

  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    .toolbar { display: none !important; }
    body { background: #fff; }
    .sheets { display: block; max-width: none; padding: 0; }
    .sticker {
      width: 194mm; height: 136mm; min-height: 0;
      margin: 0 0 6mm; padding: 10mm 12mm 8mm;
      box-shadow: none;
      break-inside: avoid; page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .sticker:nth-child(2n) { margin-bottom: 0; page-break-after: always; }
    .sticker:last-child { page-break-after: auto; }
    .brand { font-size: 11pt; }
    .room { font-size: 22pt; }
    .guests { padding-top: 6mm; }
    .guests li { font-size: 64pt; }
    .guests.two li { font-size: 46pt; }
    .guests.three li { font-size: 34pt; }
    .guests.long li { font-size: 40pt; }
    .dulhan { font-size: 42pt; }
    .foot { font-size: 11pt; }
    .sticker.bridal { min-height: 0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <h1>Door stickers</h1>
  <p>Open plates. The name fills the card, two per A4. Shagufta, Shaheena, and Rehana Begum are excluded.</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print stickers</button>
    <a href="/rooms">Room board</a>
    <a href="/barat">Going</a>
    <a href="/return">Return</a>
  </div>
</div>
<div class="sheets" id="sheets"></div>
<script>
const SKIP = new Set(["Shagufta", "Shaheena", "Rehana Begum"]);
const ROOMS = [
  { n: "504", people: ["Raghib Najmi", "Afifa Noor"], bridal: true },
  { n: "503", people: ["Taazeem Najmi"] },
  { n: "502", people: ["Aminul Huda Ansari"], papa: true },
  { n: "501", people: ["Shakil Ahmed"] },
  { n: "500", people: ["Aqil Ahmed"] },
  { n: "404", people: ["Aman Dev", "Sayem Kalim"] },
  { n: "403", people: ["Md Kamil", "Rahbar Shifat"] },
  { n: "402", people: ["Rooman Alam", "Abu Noman Khan"] },
  { n: "401", people: ["Masood Raghib", "Ashif Alam"] },
  { n: "400", people: ["Kashif Ashiqui", "Shazi (Ayan Kumar)", "Salman"] },
  { n: "304", people: ["Salhaddin", "Quiser Imam"] },
  { n: "303", people: ["Aziz Huda", "Parwez Alam"] },
  { n: "302", people: ["Zainul Abadeen", "Tabish Hayat"] },
  { n: "301", people: ["Md Nasim", "Soeb Raza"] },
  { n: "300", people: ["Faisal Shakeel", "Faizan Ahmed"] },
  { n: "204", people: ["Tabrez Hayat", "Minhajul Abeden"] },
  { n: "203", people: ["Sajidul Huda", "Imranul Huda"] },
  { n: "202", people: ["Shahwaz Anis", "Anwar Ul Haque"] },
  { n: "201", people: ["Mohd Alam", "Manahil Alam"] },
  { n: "200", people: ["Fahim Huda", "Sajiadul Arfan"] },
  { n: "104", people: ["Najmul Huda", "Israr Rafique"], king: true },
  { n: "103", people: ["Mumtaz", "Farghab Saud (Sartaj)"] },
  { n: "102", people: ["Manir Huda", "Mazhar Hussain"] },
  { n: "101", people: ["Zia Ashraf", "Tanweer Asraf"] },
  { n: "100", people: ["Md Shakeel (Samo)", "Owais"] },
  { n: "001", people: ["Modassir Barkat", "Sarwar Alam", "Md Seraj"] }
].map(r => ({ ...r, people: r.people.filter(p => !SKIP.has(p)) }))
 .filter(r => r.people.length);

function foot(r) {
  if (r.bridal) return "15 November 2026";
  if (r.papa) return "Papa";
  if (r.king) return "Father of the Groom";
  if (String(r.n).endsWith("04")) return "Best on floor";
  return "Baraat stay";
}
function sizeClass(r) {
  if (r.people.some(p => p.length > 16)) return "long";
  if (r.people.length > 2) return "three";
  if (r.people.length === 2) return "two";
  return "one";
}

document.getElementById("sheets").innerHTML = ROOMS.map(r => {
  const dulhan = r.bridal ? `<p class="dulhan">Dulhan</p>` : "";
  const names = r.people.map(p => `<li>${p}</li>`).join("");
  return `
  <article class="sticker${r.bridal ? " bridal" : ""}">
    <div class="top">
      <p class="brand">Noor weds Raghib</p>
      <p class="room">${r.n}</p>
    </div>
    ${dulhan}
    <ul class="guests ${sizeClass(r)}">${names}</ul>
    <p class="foot">${foot(r)}</p>
  </article>`;
}).join("");
</script>
</body>
</html>
