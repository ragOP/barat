<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor weds Raghib — Door stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #5c1422;
    --wine2: #3d0d16;
    --gold: #c9a24a;
    --gold2: #f0d78a;
    --ivory: #fbf4e6;
    --ink: #2a1210;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e8d9c4; color: var(--ink); }
  body { font-family: "Cormorant Garamond", Georgia, serif; }
  .toolbar {
    max-width: 920px; margin: 0 auto; padding: 22px 18px 10px;
  }
  .toolbar h1 {
    margin: 0 0 6px; font-family: Cinzel, serif; font-size: 22px;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .toolbar p { margin: 0 0 14px; color: #6f5648; font-size: 17px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .actions button, .actions a {
    appearance: none; border: 0; cursor: pointer; text-decoration: none;
    background: var(--wine); color: #fff; font-family: Cinzel, serif;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    padding: 12px 16px; border-radius: 999px;
  }
  .actions a { background: transparent; color: var(--wine); border: 1.5px solid var(--wine); }

  .sheets { padding: 10px 12px 40px; max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }

  .sticker {
    position: relative;
    background:
      radial-gradient(circle at 50% 0%, rgba(201,162,74,.22), transparent 45%),
      linear-gradient(180deg, #fff8ea, #f3e2c3 55%, #edd7b0);
    border: 4px solid var(--wine);
    box-shadow: 0 14px 34px rgba(61,13,22,.16);
    min-height: 420px;
    padding: 14px;
    overflow: hidden;
  }
  .sticker.bridal {
    background:
      radial-gradient(circle at 50% 18%, rgba(240,215,138,.55), transparent 42%),
      linear-gradient(180deg, #fff6d8, #f0c96a 70%, #d4a017);
  }
  .sticker.king {
    background:
      radial-gradient(circle at 50% 10%, rgba(240,215,138,.35), transparent 40%),
      linear-gradient(180deg, #3d0d16, #6b1c2a 48%, #b8923d);
    color: #fff4d6;
  }
  .inner {
    height: 100%; min-height: 392px;
    border: 2px solid var(--gold);
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px 24px 24px;
  }
  .sticker.king .inner { border-color: var(--gold2); }
  .corner {
    position: absolute; width: 70px; height: 70px; color: var(--gold); opacity: .95;
  }
  .sticker.king .corner { color: var(--gold2); }
  .corner.tl { top: 8px; left: 8px; }
  .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .corner.br { bottom: 8px; right: 8px; transform: scale(-1); }

  .brand {
    margin: 0; font-family: Cinzel, serif; font-weight: 700;
    font-size: clamp(22px, 4.2vw, 34px); letter-spacing: .18em;
    text-transform: uppercase; color: var(--wine); line-height: 1.15;
  }
  .sticker.king .brand { color: var(--gold2); }
  .brand em {
    font-family: "Great Vibes", cursive; font-style: normal; font-weight: 400;
    font-size: 1.55em; letter-spacing: 0; text-transform: none;
    color: var(--gold); padding: 0 10px;
  }
  .date {
    margin: 8px 0 0; font-family: Cinzel, serif;
    font-size: clamp(14px, 2.2vw, 18px); letter-spacing: .28em;
    text-transform: uppercase; color: #7a5b48;
  }
  .sticker.king .date { color: #e8d5a3; }
  .rule {
    width: min(220px, 55%); height: 2px; background: var(--gold);
    margin: 18px auto 16px; position: relative;
  }
  .rule:before, .rule:after {
    content: ""; position: absolute; top: -5px; width: 12px; height: 12px;
    border: 2px solid var(--gold); transform: rotate(45deg); background: #fff6e8;
  }
  .sticker.king .rule:before, .sticker.king .rule:after { background: #6b1c2a; border-color: var(--gold2); }
  .rule:before { left: -12px; }
  .rule:after { right: -12px; }

  .seal {
    width: 148px; height: 148px; border-radius: 50%;
    border: 3px solid var(--gold);
    box-shadow: inset 0 0 0 8px var(--wine), 0 0 0 2px var(--gold2);
    background: var(--wine2); color: #fff1cc;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 4px auto 18px;
  }
  .sticker.bridal .seal {
    background: #7a1f32;
    box-shadow: inset 0 0 0 8px #7a1f32, 0 0 0 2px #ffe9a8;
  }
  .sticker.king .seal {
    background: var(--gold2); color: var(--wine2);
    box-shadow: inset 0 0 0 8px #c9a24a, 0 0 0 2px #fff3c4;
  }
  .seal span {
    font-family: Cinzel, serif; font-size: 13px; letter-spacing: .28em;
    text-transform: uppercase; opacity: .85;
  }
  .seal strong {
    font-family: Cinzel, serif; font-size: 52px; line-height: .95; font-weight: 800;
  }
  .crown { width: 64px; height: 42px; margin: 0 0 6px; color: var(--gold); }
  .sticker.king .crown { color: var(--gold2); }

  .guests { list-style: none; margin: 0; padding: 0; width: 100%; }
  .guests li {
    font-size: clamp(34px, 6vw, 54px); font-weight: 700; line-height: 1.12;
    color: var(--wine2); letter-spacing: .01em;
  }
  .sticker.king .guests li { color: #ffe9a3; }
  .guests li + li { margin-top: 4px; }
  .guests.triple li { font-size: clamp(28px, 4.8vw, 42px); }
  .guests li.amp {
    font-family: "Great Vibes", cursive; color: var(--gold);
    font-size: 40px; font-weight: 400; margin: 2px 0 6px;
  }
  .sticker.king .guests li.amp { color: var(--gold2); }
  .foot {
    margin: 18px 0 0; font-family: Cinzel, serif;
    font-size: 13px; letter-spacing: .34em; text-transform: uppercase;
    color: #7a5b48;
  }
  .sticker.bridal .foot { color: var(--wine); font-weight: 700; }
  .sticker.king .foot { color: var(--gold2); }

  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    .toolbar { display: none !important; }
    body { background: #fff; }
    .sheets { display: block; padding: 0; max-width: none; }
    .sticker {
      width: 194mm; height: 132mm; min-height: 0; margin: 0 auto 8mm;
      box-shadow: none; break-inside: avoid; page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .sticker:nth-child(even) { margin-bottom: 0; }
    .inner { min-height: 0; height: 100%; padding: 18px 16px; }
    .brand { font-size: 28px; }
    .date { font-size: 15px; }
    .seal { width: 118px; height: 118px; margin-bottom: 12px; }
    .seal strong { font-size: 44px; }
    .guests li { font-size: 42px; }
    .guests.triple li { font-size: 34px; }
    .guests li.amp { font-size: 34px; }
    .foot { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <h1>Door stickers</h1>
  <p>Print-ready plates — large names, 2 per A4. Shagufta, Shaheena, and Rehana Begum are excluded.</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print stickers</button>
    <a href="/rooms">Room board</a>
    <a href="/barat">Going</a>
    <a href="/return">Return</a>
  </div>
</div>
<div class="sheets" id="sheets"></div>
<script>
const SKIP = new Set(["Shagufta", "Shaheena", "Rehana Begum"]);
const ROOMS = [
  { n: "504", people: ["Raghib Najmi", "Afifa Noor"], bridal: true },
  { n: "503", people: ["Taazeem Najmi"] },
  { n: "502", people: ["Amin Huda"] },
  { n: "501", people: ["Shakil Ahmed"] },
  { n: "500", people: ["Aqil Ahmed"] },
  { n: "404", people: ["Aman Dev", "Sayem Kalim"] },
  { n: "403", people: ["Md Kamil", "Rahbar Shifat"] },
  { n: "402", people: ["Rooman Alam", "Abu Noman Khan"] },
  { n: "401", people: ["Masood Raghib", "Ashif Alam"] },
  { n: "400", people: ["Kashif Ashiqui", "Shazi (Ayan Kumar)", "Salman"] },
  { n: "304", people: ["Salhaddin", "Quiser Imam"] },
  { n: "303", people: ["Aziz Huda", "Parwez Alam"] },
  { n: "302", people: ["Zainul Abadeen", "Tabish Hayat"] },
  { n: "301", people: ["Md Nasim", "Soeb Raza"] },
  { n: "300", people: ["Faisal Shakeel", "Faizan Ahmed"] },
  { n: "204", people: ["Tabrez Hayat", "Minhajul Abeden"] },
  { n: "203", people: ["Sajidul Huda", "Imranul Huda"] },
  { n: "202", people: ["Shahwaz Anis", "Anwar Ul Haque"] },
  { n: "201", people: ["Mohd Alam", "Manahil Alam"] },
  { n: "200", people: ["Fahim Huda", "Sajiadul Arfan"] },
  { n: "104", people: ["Najmul Huda", "Israr Rafique"], king: true },
  { n: "103", people: ["Mumtaz", "Farghab Saud (Sartaj)"] },
  { n: "102", people: ["Manir Huda", "Mazhar Hussain"] },
  { n: "101", people: ["Zia Ashraf", "Tanweer Asraf"] },
  { n: "100", people: ["Md Shakeel (Samo)", "Owais"] },
  { n: "001", people: ["Modassir Barkat", "Sarwar Alam", "Md Seraj"] }
].map(r => ({ ...r, people: r.people.filter(p => !SKIP.has(p)) }))
 .filter(r => r.people.length);

const corner = `
<svg class="corner" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <path d="M8 50 Q8 8 50 8" stroke="currentColor" stroke-width="2"/>
  <path d="M16 50 Q16 16 50 16" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="14" cy="14" r="2.6" fill="currentColor"/>
  <path d="M22 10 C27 20 37 20 42 10" stroke="currentColor" stroke-width="1.2"/>
</svg>`;
const crown = `<svg class="crown" viewBox="0 0 64 40" fill="currentColor" aria-hidden="true"><path d="M6 34h52l-4-18-12 10L32 6 22 26 10 16 6 34z"/><circle cx="10" cy="14" r="3"/><circle cx="32" cy="5" r="3.4"/><circle cx="54" cy="14" r="3"/><rect x="8" y="32" width="48" height="6" rx="1"/></svg>`;

function foot(r) {
  if (r.bridal) return "The Couple";
  if (r.king) return "Father of the Groom";
  if (String(r.n).endsWith("04")) return "Best on floor";
  return "Baraat Stay";
}

document.getElementById("sheets").innerHTML = ROOMS.map(r => {
  const names = r.people.length === 2
    ? `<li>${r.king ? "♛ " : ""}${r.people[0]}</li><li class="amp" aria-hidden="true">&amp;</li><li>${r.people[1]}</li>`
    : r.people.map((p, i) => `<li>${r.king && i === 0 ? "♛ " : ""}${p}</li>`).join("");
  return `
  <article class="sticker${r.bridal ? " bridal" : ""}${r.king ? " king" : ""}">
    <div class="inner">
      ${corner.replace('class="corner"', 'class="corner tl"')}
      ${corner.replace('class="corner"', 'class="corner tr"')}
      ${corner.replace('class="corner"', 'class="corner bl"')}
      ${corner.replace('class="corner"', 'class="corner br"')}
      ${r.king || r.bridal ? crown : ""}
      <p class="brand">Noor <em>weds</em> Raghib</p>
      <p class="date">15 November 2026</p>
      <div class="rule"></div>
      <div class="seal"><span>Room</span><strong>${r.n}</strong></div>
      <ul class="guests${r.people.length > 2 ? " triple" : ""}">${names}</ul>
      <p class="foot">${foot(r)}</p>
    </div>
  </article>`;
}).join("");
</script>
</body>
</html>
