<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Noor weds Raghib</title>
  <style>
    :root { --wine:#6b1c2a; --gold:#c4a056; --ink:#2a1810; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Georgia, serif;
      background: #efe4d2; color: var(--ink);
      padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
    }
    main { max-width: 440px; margin: 0 auto; }
    p.kicker { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: #7a6454; }
    h1 { font-size: 28px; margin: 6px 0 20px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: #fffaf2; border: 1.5px solid var(--wine);
      border-radius: 16px; padding: 16px 18px; margin: 0 0 12px;
    }
    a.card b { display: block; font-size: 18px; color: var(--wine); }
    a.card span { color: #7a6454; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <p class="kicker">15 November 2026</p>
  <h1>Noor weds Raghib</h1>
  <a class="card" href="/barat"><b>Going train</b><span>15 Nov · Vande Bharat · /barat</span></a>
  <a class="card" href="/return"><b>Return train</b><span>16 Nov · Janshatabdi · /return</span></a>
  <a class="card" href="/rooms"><b>Hotel rooms</b><span>Door plates · /rooms</span></a>
</main>
</body>
</html>
