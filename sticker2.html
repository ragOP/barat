<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor weds Raghib — Sasural stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Great+Vibes&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --leaf: #0e2a23;
    --leaf-2: #16483b;
    --gold: #e0c27a;
    --gold-2: #f3e2b0;
    --ink: #14241c;
    --paper: #dfeae3;
    --card: #fbf6ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: Outfit, system-ui, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -10%, #2a6a58 0%, transparent 55%),
      #12362d;
  }
  .toolbar { max-width: 880px; margin: 0 auto; padding: 26px 18px 8px; color: #f6f1e4; }
  .toolbar h1 {
    margin: 0 0 6px; font-family: Fraunces, Georgia, serif;
    font-weight: 560; font-size: 42px; letter-spacing: -.03em;
  }
  .toolbar p { margin: 0 0 14px; color: rgba(246,241,228,.75); font-size: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .actions a {
    appearance: none; cursor: pointer; text-decoration: none;
    border: 1.5px solid var(--gold); background: transparent; color: var(--gold-2);
    font-family: Outfit, sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 999px;
  }
  .actions button { background: var(--gold); color: var(--leaf); border-color: var(--gold); }

  .sheets { max-width: 880px; margin: 0 auto; padding: 12px 14px 48px; display: grid; gap: 18px; }

  .sticker {
    position: relative; min-height: 300px; padding: 12px;
    background:
      radial-gradient(circle at 18px 18px, rgba(224,194,122,.45) 1.1px, transparent 1.3px) 0 0 / 22px 22px,
      linear-gradient(160deg, #fffaf1, #f3e7cf 70%, #efe0c0);
    border: 3px solid var(--leaf);
    box-shadow: 0 22px 40px -28px rgba(0,0,0,.7);
    overflow: hidden;
  }
  .inner {
    min-height: 276px; height: 100%;
    border: 1.5px solid var(--gold);
    position: relative;
    display: flex; flex-direction: column;
    padding: 16px 18px 14px;
    background: linear-gradient(180deg, rgba(255,252,245,.55), rgba(255,248,236,.2));
  }
  .corner { position: absolute; width: 62px; height: 62px; color: #b8923d; pointer-events: none; }
  .corner.tl { top: 6px; left: 6px; }
  .corner.tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .corner.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
  .corner.br { bottom: 6px; right: 6px; transform: scale(-1); }
  .head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: relative; z-index: 1;
  }
  .brand {
    margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: var(--leaf-2);
  }
  .seal {
    width: 86px; height: 86px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--leaf);
    background:
      radial-gradient(circle at 50% 45%, #fff8e8 0 58%, transparent 60%),
      conic-gradient(from 20deg, #e0c27a, #f8ecc8, #c6a15a, #f3e2b0, #e0c27a);
    box-shadow: 0 0 0 4px rgba(255,248,232,.85), 0 0 0 6px #b8923d;
    font-family: Fraunces, Georgia, serif; font-weight: 700;
    font-size: 30px; letter-spacing: -.03em; line-height: 1;
  }
  .ornament { width: 150px; height: 18px; margin: 8px auto 0; color: #b8923d; position: relative; z-index: 1; }
  .guests {
    list-style: none; margin: 0; padding: 6px 8px 0;
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 1;
  }
  .guests li {
    font-family: Fraunces, Georgia, serif; font-weight: 700;
    letter-spacing: -.03em; line-height: .92; color: var(--leaf);
    font-size: clamp(54px, 9vw, 84px);
  }
  .guests.two li { font-size: clamp(42px, 7vw, 64px); }
  .guests.three li { font-size: clamp(34px, 5.4vw, 48px); }
  .guests.four li { font-size: clamp(28px, 4.6vw, 40px); }
  .foot {
    margin: 4px 0 2px; text-align: center;
    font-size: 12px; font-weight: 600; letter-spacing: .28em;
    text-transform: uppercase; color: #7a6240; position: relative; z-index: 1;
  }

  .sticker.crew { filter: saturate(.85); }
  .sticker.crew .seal { font-size: 28px; }

  .sticker.bridal, .sticker.saasu {
    background:
      radial-gradient(circle at 16px 16px, rgba(224,194,122,.28) 1px, transparent 1.2px) 0 0 / 20px 20px,
      linear-gradient(165deg, #14382f, #0c241e 55%, #1a4034);
    border-color: var(--gold);
    color: #fbf6ec;
  }
  .sticker.bridal .inner, .sticker.saasu .inner {
    border-color: rgba(224,194,122,.75);
    background: linear-gradient(180deg, rgba(255,236,180,.08), transparent 40%);
  }
  .sticker.bridal .corner, .sticker.saasu .corner { color: var(--gold); }
  .sticker.bridal .brand, .sticker.saasu .brand { color: rgba(243,226,176,.8); }
  .sticker.bridal .guests li, .sticker.saasu .guests li { color: #fff8ea; }
  .sticker.bridal .foot, .sticker.saasu .foot { color: rgba(243,226,176,.75); }
  .sticker.bridal .seal, .sticker.saasu .seal { color: #10241e; }
  .script {
    margin: 2px 0 0; text-align: center;
    font-family: "Great Vibes", cursive; font-weight: 400;
    font-size: clamp(46px, 8vw, 68px); line-height: .8; color: var(--gold);
    position: relative; z-index: 1;
  }
  .sticker.saasu .script { font-size: clamp(52px, 9vw, 76px); }

  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    .toolbar { display: none !important; }
    body { background: #fff; }
    .sheets { display: block; max-width: none; padding: 0; }
    .sticker {
      width: 194mm; height: 136mm; min-height: 0; margin: 0 0 6mm;
      box-shadow: none; break-inside: avoid; page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .sticker:nth-child(2n) { margin-bottom: 0; page-break-after: always; }
    .sticker:last-child { page-break-after: auto; }
    .inner { min-height: 0; height: 100%; padding: 6mm 7mm; }
    .seal { width: 22mm; height: 22mm; font-size: 16pt; }
    .brand { font-size: 11pt; }
    .guests li { font-size: 52pt; }
    .guests.two li { font-size: 38pt; }
    .guests.three li { font-size: 28pt; }
    .guests.four li { font-size: 22pt; }
    .script { font-size: 36pt; }
    .sticker.saasu .script { font-size: 42pt; }
    .foot { font-size: 10pt; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <h1>Sasural stickers</h1>
  <p>Door plates for the family stay. Two per A4.</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print stickers</button>
    <a href="/sasroom">Sasural rooms</a>
    <a href="/sticker">Hotel stickers</a>
  </div>
</div>
<div class="sheets" id="sheets"></div>
<script>
const ROOMS = [
  { n: "304", people: ["Raghib", "Noor"], bridal: true },
  { n: "204", people: ["Ammi"], saasu: true },
  { n: "203", people: ["Sajid", "Huzaifa"] },
  { n: "202", people: ["Zeba", "Hania", "Mohsin"] },
  { n: "201", people: ["Chote Mamu", "Imjamam"] },
  { n: "104", people: ["Munni", "Zaid", "Zidane"] },
  { n: "103", people: ["Nesar Khalu", "Mamu"] },
  { n: "102", people: ["Rizwana Aunty", "Badi Khala"] },
  { n: "101", people: ["Mami", "Inaya", "Liaba"] },
  { n: "004", people: ["Gudiya Aapi", "Zoya", "Asif", "Zeeshan"] },
  { n: "003", people: ["Affan", "Meezan"] },
  { n: "002", people: ["Ziyaul Bhai", "Shahid"] },
  { n: "001", people: ["Makeup Artist"], crew: true },
  { n: "000", people: ["Photographer"], crew: true }
];

function foot(r) {
  if (r.bridal) return "15 November 2026";
  if (r.crew) return "Crew";
  return "Sasural stay";
}
function sizeClass(r) {
  if (r.people.length > 3) return "four";
  if (r.people.length > 2) return "three";
  if (r.people.length === 2) return "two";
  return "one";
}
const corner = `<svg class="corner" viewBox="0 0 72 72" fill="none" aria-hidden="true">
  <path d="M6 58C6 22 22 6 58 6" stroke="currentColor" stroke-width="1.7"/>
  <path d="M14 58C14 30 30 14 58 14" stroke="currentColor" stroke-width="1"/>
  <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
  <path d="M22 8c5 7 12 8 18 2" stroke="currentColor" stroke-width="1"/>
  <path d="M8 22c7 5 8 12 2 18" stroke="currentColor" stroke-width="1"/>
</svg>`;
const ornament = `<svg class="ornament" viewBox="0 0 160 18" fill="none" aria-hidden="true">
  <path d="M4 9h58M98 9h58" stroke="currentColor" stroke-width="1.2"/>
  <path d="M70 9l10-7 10 7-10 7z" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="80" cy="9" r="1.6" fill="currentColor"/>
</svg>`;

document.getElementById("sheets").innerHTML = ROOMS.map(r => {
  const names = r.people.map(p => `<li>${p}</li>`).join("");
  const cls = ["sticker", r.bridal ? "bridal" : "", r.saasu ? "saasu" : "", r.crew ? "crew" : ""].filter(Boolean).join(" ");
  const script = r.bridal ? `<p class="script">Dulhan Kamra</p>` : r.saasu ? `<p class="script">Saasu Maa</p>` : "";
  return `
  <article class="${cls}">
    <div class="inner">
      ${corner.replace('class="corner"', 'class="corner tl"')}
      ${corner.replace('class="corner"', 'class="corner tr"')}
      ${corner.replace('class="corner"', 'class="corner bl"')}
      ${corner.replace('class="corner"', 'class="corner br"')}
      <div class="head">
        <p class="brand">Noor weds Raghib</p>
        <p class="seal">${r.n}</p>
      </div>
      ${script}
      ${ornament}
      <ul class="guests ${sizeClass(r)}">${names}</ul>
      <p class="foot">${foot(r)}</p>
    </div>
  </article>`;
}).join("");
</script>
</body>
</html>
