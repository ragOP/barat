<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor weds Raghib — Sasural stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Great+Vibes&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --leaf: #14382f;
    --leaf-2: #1d4f42;
    --ink: #14241c;
    --paper: #e7f0ea;
    --card: #fbf7f0;
    --gold: #d7b56a;
    --muted: #5e7368;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: Outfit, system-ui, sans-serif; }
  .toolbar { max-width: 860px; margin: 0 auto; padding: 26px 18px 8px; }
  .toolbar h1 {
    margin: 0 0 6px; font-family: Fraunces, Georgia, serif;
    font-weight: 560; font-size: 40px; letter-spacing: -.03em; color: var(--leaf);
  }
  .toolbar p { margin: 0 0 14px; color: var(--muted); font-size: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .actions a {
    appearance: none; cursor: pointer; text-decoration: none;
    border: 1.5px solid var(--leaf); background: transparent; color: var(--leaf);
    font-family: Outfit, sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 999px;
  }
  .actions button { background: var(--leaf); color: #f6f1e4; }

  .sheets {
    max-width: 860px; margin: 0 auto; padding: 16px 14px 48px;
    display: grid; gap: 16px;
  }
  .sticker {
    display: grid; grid-template-columns: 132px 1fr;
    min-height: 230px; background: var(--card);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 16px 36px -28px rgba(20, 56, 47, .7);
  }
  .num {
    margin: 0; background: var(--leaf); color: #f4e7c8;
    display: grid; place-items: center;
    font-family: Fraunces, Georgia, serif;
    font-weight: 680; font-size: 58px; letter-spacing: -.04em; line-height: 1;
  }
  .body {
    padding: 16px 22px 14px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .brand {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
  }
  .guests {
    list-style: none; margin: 0; padding: 8px 0 0;
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }
  .guests li {
    font-family: Fraunces, Georgia, serif; font-weight: 680;
    line-height: .94; letter-spacing: -.03em; color: var(--leaf);
    font-size: clamp(52px, 8vw, 78px);
  }
  .guests.two li { font-size: clamp(40px, 6.2vw, 58px); }
  .guests.three li { font-size: clamp(34px, 5.2vw, 46px); }
  .guests.four li { font-size: clamp(28px, 4.4vw, 38px); }
  .foot {
    margin: 8px 0 0; font-size: 12px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--leaf-2);
  }
  .sticker.crew .num { background: #3e534b; }
  .sticker.crew .guests li { color: #24352e; }

  .sticker.bridal {
    grid-template-columns: 150px 1fr;
    background: #10241e; min-height: 260px;
  }
  .sticker.bridal .num { background: var(--gold); color: #10241e; font-size: 64px; }
  .sticker.bridal .brand { color: rgba(246, 241, 228, .7); }
  .sticker.bridal .guests li { color: #fbf7f0; }
  .sticker.bridal .guests.two li { font-size: clamp(48px, 7vw, 70px); }
  .sticker.bridal .foot { color: rgba(246, 241, 228, .72); }
  .dulhan {
    margin: 8px 0 0; font-family: "Great Vibes", cursive;
    font-size: clamp(40px, 6vw, 56px); line-height: .8; color: var(--gold);
  }

  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    .toolbar { display: none !important; }
    body { background: #fff; }
    .sheets { display: block; max-width: none; padding: 0; }
    .sticker {
      width: 194mm; height: 136mm; min-height: 0;
      margin: 0 0 6mm; border-radius: 0; box-shadow: none;
      grid-template-columns: 46mm 1fr;
      break-inside: avoid; page-break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .sticker:nth-child(2n) { margin-bottom: 0; page-break-after: always; }
    .sticker:last-child { page-break-after: auto; }
    .num { font-size: 48pt; }
    .body { padding: 8mm 10mm; }
    .brand { font-size: 11pt; }
    .guests li { font-size: 60pt; }
    .guests.two li { font-size: 42pt; }
    .guests.three li { font-size: 32pt; }
    .guests.four li { font-size: 26pt; }
    .sticker.bridal { grid-template-columns: 48mm 1fr; min-height: 0; }
    .sticker.bridal .num { font-size: 52pt; }
    .sticker.bridal .guests.two li { font-size: 48pt; }
    .dulhan { font-size: 36pt; }
    .foot { font-size: 11pt; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <h1>Sasural stickers</h1>
  <p>Door plates for the family stay. Two per A4.</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print stickers</button>
    <a href="/sasroom">Sasural rooms</a>
    <a href="/sticker">Hotel stickers</a>
  </div>
</div>
<div class="sheets" id="sheets"></div>
<script>
const ROOMS = [
  { n: "304", people: ["Raghib", "Noor"], bridal: true },
  { n: "204", people: ["Ammi"] },
  { n: "203", people: ["Sajid", "Huzaifa"] },
  { n: "202", people: ["Zeba", "Hania", "Mohsin"] },
  { n: "201", people: ["Chote Mamu", "Imjamam"] },
  { n: "104", people: ["Munni", "Zaid", "Zidane"] },
  { n: "103", people: ["Nesar Khalu", "Mamu"] },
  { n: "102", people: ["Rizwana Aunty", "Badi Khala"] },
  { n: "101", people: ["Mami", "Inaya", "Liaba"] },
  { n: "004", people: ["Gudiya Aapi", "Zoya", "Asif", "Zeeshan"] },
  { n: "003", people: ["Affan", "Meezan"] },
  { n: "002", people: ["Ziyaul Bhai", "Shahid"] },
  { n: "001", people: ["Makeup Artist"], crew: true },
  { n: "000", people: ["Photographer"], crew: true }
];

function foot(r) {
  if (r.bridal) return "15 November 2026";
  if (r.crew) return "Crew";
  return "Sasural stay";
}
function sizeClass(r) {
  if (r.people.length > 3) return "four";
  if (r.people.length > 2) return "three";
  if (r.people.length === 2) return "two";
  return "one";
}

document.getElementById("sheets").innerHTML = ROOMS.map(r => {
  const names = r.people.map(p => `<li>${p}</li>`).join("");
  const cls = ["sticker", r.bridal ? "bridal" : "", r.crew ? "crew" : ""].filter(Boolean).join(" ");
  return `
  <article class="${cls}">
    <p class="num">${r.n}</p>
    <div class="body">
      <p class="brand">Noor weds Raghib</p>
      ${r.bridal ? `<p class="dulhan">Dulhan Kamra</p>` : ""}
      <ul class="guests ${sizeClass(r)}">${names}</ul>
      <p class="foot">${foot(r)}</p>
    </div>
  </article>`;
}).join("");
</script>
</body>
</html>
