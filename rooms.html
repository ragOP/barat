<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor weds Raghib — Room door plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #6b1c2a;
    --wine2: #4a101b;
    --gold: #c4a056;
    --gold2: #e8d5a3;
    --ivory: #fbf3e4;
    --ink: #2a1810;
    --muted: #7a6454;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #efe4d2; color: var(--ink); }
  body { font-family: "Cormorant Garamond", Georgia, serif; }
  .no-print { padding: 22px 18px 10px; max-width: 980px; margin: 0 auto; }
  .no-print h1 {
    font-family: Cinzel, serif; font-size: 22px; letter-spacing: .12em;
    text-transform: uppercase; margin: 0 0 6px;
  }
  .no-print p { margin: 0 0 12px; color: var(--muted); font-size: 17px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
  .actions a, .actions button {
    appearance: none; border: 0; cursor: pointer; text-decoration: none;
    background: var(--wine); color: #fff; font-family: Cinzel, serif;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 999px;
  }
  .actions a { background: transparent; color: var(--wine); border: 1.5px solid var(--wine); }
  table {
    width: 100%; border-collapse: collapse; background: #fffaf2;
    font-size: 16px; margin-bottom: 28px;
  }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #ead9c4; }
  th { font-family: Cinzel, serif; font-size: 11px; letter-spacing: .08em; color: var(--wine); }
  .room-no { font-family: Cinzel, serif; font-weight: 700; color: var(--wine); }
  .note { font-size: 14px; color: var(--muted); }

  .plates {
    display: grid; gap: 18px; padding: 10px 12px 40px;
    max-width: 920px; margin: 0 auto;
  }
  .plate {
    background: var(--ivory);
    aspect-ratio: 1.48 / 1;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(74,16,27,.12);
    position: relative;
  }
  .plate.bridal { background: linear-gradient(180deg, #fbf6ea, #f3e2c4); }
  .frame {
    height: 100%;
    border: 2.5px solid var(--wine);
    padding: 7px;
  }
  .frame2 {
    height: 100%;
    border: 1.5px solid var(--gold);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 18px 20px 16px;
    background:
      radial-gradient(circle at 50% 0%, rgba(196,160,86,.18), transparent 42%),
      linear-gradient(#fbf3e4, #f7ead3);
  }
  .orn {
    position: absolute; width: 54px; height: 54px; color: var(--gold); opacity: .9;
  }
  .orn.tl { top: 6px; left: 6px; }
  .orn.tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .orn.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
  .orn.br { bottom: 6px; right: 6px; transform: scale(-1); }
  .kicker {
    font-family: Cinzel, serif; font-size: clamp(11px, 2.1vw, 15px);
    letter-spacing: .28em; text-transform: uppercase; color: var(--wine);
    margin: 0;
  }
  .kicker em {
    font-family: "Great Vibes", cursive; font-style: normal; font-size: 1.7em;
    letter-spacing: 0; text-transform: none; color: var(--gold);
    padding: 0 8px;
  }
  .date {
    margin: 4px 0 0; font-size: clamp(12px, 2vw, 15px); letter-spacing: .22em;
    text-transform: uppercase; color: var(--muted);
  }
  .rule {
    width: 120px; height: 1px; background: var(--gold); margin: 12px auto 10px;
    position: relative;
  }
  .rule:before, .rule:after {
    content: ""; position: absolute; top: -3px; width: 7px; height: 7px;
    border: 1px solid var(--gold); transform: rotate(45deg); background: var(--ivory);
  }
  .rule:before { left: -8px; }
  .rule:after { right: -8px; }
  .seal {
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px solid var(--gold);
    box-shadow: inset 0 0 0 5px var(--wine), 0 0 0 1px var(--gold2);
    background: var(--wine2); color: #f8e7c4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 4px auto 12px;
  }
  .plate.bridal .seal {
    background: #7a1f32;
    box-shadow: inset 0 0 0 5px #7a1f32, 0 0 0 1px var(--gold2);
  }
  .seal span {
    font-family: Cinzel, serif; font-size: 9px; letter-spacing: .22em;
    text-transform: uppercase; opacity: .8;
  }
  .seal strong {
    font-family: Cinzel, serif; font-size: 28px; line-height: 1; font-weight: 700;
  }
  .guests { list-style: none; margin: 0; padding: 0; }
  .guests li {
    font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; line-height: 1.15;
    color: var(--wine2);
  }
  .guests li + li { margin-top: 4px; }
  .guests.triple li { font-size: clamp(18px, 2.8vw, 28px); }
  .guests li.amp {
    font-family: "Great Vibes", cursive; color: var(--gold);
    font-size: 22px; font-weight: 400; line-height: 1; margin: 2px 0;
  }
  .foot {
    margin: 12px 0 0; font-family: Cinzel, serif; font-size: 10px;
    letter-spacing: .26em; text-transform: uppercase; color: var(--muted);
  }
  .plate.bridal .foot { color: var(--wine); }

  @media print {
    @page { size: A4 portrait; margin: 9mm; }
    .no-print { display: none !important; }
    body { background: #fff; }
    .plates { display: block; padding: 0; max-width: none; }
    .plate {
      width: 192mm; height: 132mm; margin: 0 auto 8mm;
      box-shadow: none; break-inside: avoid; page-break-inside: avoid;
      aspect-ratio: auto;
    }
    .plate:nth-child(even) { margin-bottom: 0; }
    .kicker { font-size: 15px; }
    .date { font-size: 13px; }
    .guests li { font-size: 32px; }
    .guests.triple li { font-size: 26px; }
    .seal { width: 98px; height: 98px; }
    .seal strong { font-size: 32px; }
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
</style>
</head>
<body>
<div class="no-print">
  <h1>Noor weds Raghib</h1>
  <p>25 rooms, numbered 504→500 then 405→401, 305→301, 205→201, 105→101. 51 guests, one triple in 102. Print as door plates (2 per A4).</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print door plates</button>
    <a href="/return.html">Return train list</a>
    <a href="/barat.html">Going train list</a>
  </div>
  <table>
    <thead>
      <tr><th>Room</th><th>Guests</th><th>Why this pair</th></tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>
<div class="plates" id="plates"></div>
<script>
const ROOMS = [
  { n: "504", why: "The couple", people: ["Raghib Najmi", "Afifa Noor"], bridal: true },
  { n: "503", why: "As you asked", people: ["Amin Huda", "Shagufta"] },
  { n: "502", why: "As you asked", people: ["Shakil Ahmed", "Shaheena"] },
  { n: "501", why: "As you asked", people: ["Aqil Ahmed", "Rehana Begum"] },
  { n: "500", why: "As you asked", people: ["Taazeem Najmi", "Sayem Kalim"] },
  { n: "405", why: "Kept together from your first list", people: ["Najmul Huda", "Israr Rafique"] },
  { n: "404", why: "Similar age, 55 & 52", people: ["Aziz Huda", "Zia Ashraf"] },
  { n: "403", why: "Elders, both 58, same ticket", people: ["Manir Huda", "Mazhar Hussain"] },
  { n: "402", why: "Alam seniors, 65 & 62", people: ["Parwez Alam", "Sartaj Alam"] },
  { n: "401", why: "Same ticket, both 61", people: ["Tanweer Asraf", "Salhaddin"] },
  { n: "305", why: "Seniors, both 63", people: ["Mumtaz", "Quiser Imam"] },
  { n: "304", why: "Seniors, both 62", people: ["Md Nasim", "Md Shakeel"] },
  { n: "303", why: "60 & 52", people: ["Soeb Raza", "Tabrez Hayat"] },
  { n: "302", why: "Huda brothers, 46 & 41", people: ["Sajidul Huda", "Imranul Huda"] },
  { n: "301", why: "Same ticket, both 45", people: ["Shahwaz Anis", "Anwar Ul Haque"] },
  { n: "205", why: "Alam father & son", people: ["Mohd Alam", "Manahil Alam"] },
  { n: "204", why: "Both 44", people: ["Shazi", "Tabish Hayat"] },
  { n: "203", why: "Same ticket, 42 & 40", people: ["Fahim Huda", "Sajiadul Arfan"] },
  { n: "202", why: "Abeden family, 42 & 38", people: ["Zainul Abadeen", "Minhajul Abeden"] },
  { n: "201", why: "Same ticket, 36 & 35", people: ["Modassir Barkat", "Abu Noman Khan"] },
  { n: "105", why: "Alam brothers, 33 & 29", people: ["Sarwar Alam", "Rooman Alam"] },
  { n: "104", why: "Shakeel family, 32 & 28", people: ["Faisal Shakeel", "Faizan Ahmed"] },
  { n: "103", why: "Same ticket, 29 & 31", people: ["Md Kamil", "Md Seraj"] },
  { n: "102", why: "Young group — only triple", people: ["Ashif Alam", "Masood Raghib", "Abhishek Gupta"] },
  { n: "101", why: "Young, 29 & 22", people: ["Rahbar Shifat", "Kashif Ashiqui"] }
];

const corner = `
<svg class="orn" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <path d="M8 48 Q8 8 48 8" stroke="currentColor" stroke-width="1.6"/>
  <path d="M16 48 Q16 16 48 16" stroke="currentColor" stroke-width="1"/>
  <circle cx="14" cy="14" r="2.2" fill="currentColor"/>
  <path d="M22 10 C26 18 34 18 38 10" stroke="currentColor" stroke-width="1"/>
</svg>`;

document.getElementById("table").innerHTML = ROOMS.map(r => `
  <tr>
    <td class="room-no">${r.n}</td>
    <td>${r.people.join(" · ")}</td>
    <td class="note">${r.why}</td>
  </tr>
`).join("");

document.getElementById("plates").innerHTML = ROOMS.map(r => {
  const names = r.people.length === 2
    ? `<li>${r.people[0]}</li><li class="amp" aria-hidden="true">&amp;</li><li>${r.people[1]}</li>`
    : r.people.map(p => `<li>${p}</li>`).join("");
  return `
  <article class="plate${r.bridal ? " bridal" : ""}">
    <div class="frame"><div class="frame2">
      ${corner.replace('class="orn"', 'class="orn tl"')}
      ${corner.replace('class="orn"', 'class="orn tr"')}
      ${corner.replace('class="orn"', 'class="orn bl"')}
      ${corner.replace('class="orn"', 'class="orn br"')}
      <p class="kicker">Noor <em>weds</em> Raghib</p>
      <p class="date">15 November 2026</p>
      <div class="rule"></div>
      <div class="seal"><span>Room</span><strong>${r.n}</strong></div>
      <ul class="guests${r.people.length > 2 ? " triple" : ""}">${names}</ul>
      <p class="foot">${r.bridal ? "The Couple" : "Baraat Stay"}</p>
    </div></div>
  </article>`;
}).join("");
</script>
</body>
</html>
