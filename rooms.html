<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor weds Raghib — Room door plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #6b1c2a;
    --wine2: #4a101b;
    --gold: #c4a056;
    --gold2: #e8d5a3;
    --ivory: #fbf3e4;
    --ink: #2a1810;
    --muted: #7a6454;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #efe4d2; color: var(--ink); }
  body { font-family: "Cormorant Garamond", Georgia, serif; }
  .no-print { padding: 22px 18px 10px; max-width: 1180px; margin: 0 auto; }
  .no-print h1 {
    font-family: Cinzel, serif; font-size: 22px; letter-spacing: .12em;
    text-transform: uppercase; margin: 0 0 6px;
  }
  .no-print > p { margin: 0 0 12px; color: var(--muted); font-size: 17px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
  .actions a, .actions button {
    appearance: none; border: 0; cursor: pointer; text-decoration: none;
    background: var(--wine); color: #fff; font-family: Cinzel, serif;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 999px;
  }
  .actions a { background: transparent; color: var(--wine); border: 1.5px solid var(--wine); }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    background: var(--wine2);
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(74,16,27,.22);
  }
  .tabbar a {
    color: rgba(248,231,196,.7); text-align: center; text-decoration: none;
    font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 6px; border-radius: 12px; font-family: Cinzel, serif;
  }
  .tabbar a.on { background: rgba(255,255,255,.12); color: #fff; }

  .hotel {
    margin: 8px 0 28px;
    border: 2.5px solid var(--wine);
    border-radius: 24px;
    overflow: hidden;
    background: #3a1a14;
    box-shadow: 0 18px 50px rgba(74,16,27,.18);
  }
  .floor { padding: 0 0 12px; background: linear-gradient(#4a2018, #32140f); }
  .floor + .floor { border-top: 3px solid #c4a056; }
  .floor-head {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(90deg, #2a1010, #6b1c2a);
    color: #f8e7c4; padding: 12px 16px;
  }
  .floor-num {
    font-family: Cinzel, serif; font-size: 42px; line-height: .9; font-weight: 700;
    min-width: 52px; color: var(--gold2);
  }
  .floor-head h2 {
    margin: 0; font-family: Cinzel, serif; font-size: 15px;
    letter-spacing: .16em; text-transform: uppercase;
  }
  .floor-head p { margin: 3px 0 0; font-size: 14px; color: var(--gold2); }
  .floor-head .lock {
    margin-left: auto; font-family: Cinzel, serif; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase;
    background: #157347; color: #fff; border-radius: 999px; padding: 7px 10px;
  }
  .corridor {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; padding: 12px 12px 6px; align-items: end;
  }
  .pending-block {
    margin: 0 0 18px;
    border: 2px dashed var(--wine);
    border-radius: 20px;
    overflow: hidden;
    background: #fff8ee;
  }
  .pending-head {
    background: #8a4b16; color: #fff8ee;
    padding: 12px 16px; font-family: Cinzel, serif;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .pending-head h2 { margin: 0; font-size: 14px; }
  .pending-head p { margin: 4px 0 0; font-size: 13px; opacity: .85; letter-spacing: 0; text-transform: none; font-family: "Cormorant Garamond", Georgia, serif; }
  .pending-row {
    padding: 14px 16px; border-top: 1px solid #e6d3b8;
    display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center;
  }
  .pending-row .room-no { font-family: Cinzel, serif; font-size: 22px; color: #8a4b16; font-weight: 700; }
  .pending-row .who { font-size: 18px; line-height: 1.25; }
  .plate.pending .seal { background: #8a4b16; }
  .plate.pending .foot { color: #8a4b16; }
  .door.vacant, .plate.vacant .frame2 {
    opacity: .72;
    background: repeating-linear-gradient(-45deg, #efe0cc, #efe0cc 8px, #e4d2b8 8px, #e4d2b8 16px);
  }
  .door.vacant { color: #6a5348; border: 2px dashed #a88868; }
  .door {
    position: relative; text-align: center;
    border-radius: 14px 14px 6px 6px;
    padding: 12px 8px 10px;
    min-height: 132px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 8px 16px rgba(0,0,0,.18);
  }
  .door .badge { font-family: Cinzel, serif; letter-spacing: .12em; text-transform: uppercase; }
  .door .no { font-family: Cinzel, serif; font-weight: 700; line-height: 1; }
  .door .who { margin: 6px 0 0; font-size: 14px; line-height: 1.2; }
  .door .tag {
    margin-top: auto; padding-top: 8px;
    font-family: Cinzel, serif; font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  }
  .crown { width: 28px; height: 20px; margin-bottom: 4px; color: #e8c96a; }
  .r04 {
    min-height: 188px; background: linear-gradient(180deg, #f7e7c4, #e4c98a);
    color: #4a101b; border: 3px solid #f3d58a;
    transform: translateY(-6px);
  }
  .r04 .no { font-size: 30px; }
  .r04 .tag { color: #7a2e16; }
  .r03 {
    min-height: 168px; background: linear-gradient(180deg, #f6ead8, #e8d3b4);
    color: #4a101b; border: 2px solid #d7b57a;
  }
  .r03 .no { font-size: 26px; }
  .r02 {
    min-height: 152px; background: linear-gradient(180deg, #efe0cc, #ddc4a4);
    color: #4a101b; border: 1.5px solid #c9a87a;
  }
  .r02 .no { font-size: 23px; }
  .r01 {
    min-height: 140px; background: linear-gradient(180deg, #e8d5c0, #d2b79a);
    color: #4a101b; border: 1px solid #b99470;
  }
  .r01 .no { font-size: 21px; }
  .r00 {
    min-height: 128px; background: linear-gradient(180deg, #dec9b2, #c7ad93);
    color: #4a101b; border: 1px solid #a88868; opacity: .96;
  }
  .r00 .no { font-size: 19px; }
  .door.couple {
    background: linear-gradient(180deg, #fff6dc, #f0c96a 55%, #d4a017);
    border: 3px solid #ffe9a3;
    box-shadow: 0 0 0 2px #6b1c2a, 0 12px 24px rgba(212,160,23,.45);
    color: #4a101b;
  }
  .door.couple .tag { color: #6b1c2a; font-weight: 700; }
  .door.king {
    background: linear-gradient(180deg, #3a1418, #6b1c2a 40%, #c4a056);
    color: #f8e7c4; border: 3px solid #e8c96a;
    box-shadow: 0 0 0 2px #2a1010, 0 12px 24px rgba(232,201,106,.35);
  }
  .door.king .no { color: #ffe9a3; }
  .door.king .tag { color: #ffe9a3; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 0 0 12px;
    font-size: 14px; color: var(--muted);
  }
  .legend b { color: var(--wine); }

  .plates { display: grid; gap: 18px; padding: 10px 12px 40px; max-width: 920px; margin: 0 auto; }
  .plate {
    background: var(--ivory); aspect-ratio: 1.48 / 1; padding: 10px;
    box-shadow: 0 10px 30px rgba(74,16,27,.12); position: relative;
  }
  .plate.bridal { background: linear-gradient(180deg, #fbf6ea, #f3e2c4); }
  .plate.king { background: linear-gradient(180deg, #f7ecd4, #e8c96a 120%); }
  .plate.r04:not(.bridal):not(.king) { background: linear-gradient(180deg, #fbf6ea, #eed9b0); }
  .frame { height: 100%; border: 2.5px solid var(--wine); padding: 7px; }
  .plate.king .frame { border-color: #c4a056; }
  .frame2 {
    height: 100%; border: 1.5px solid var(--gold); position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 18px 20px 16px;
    background: radial-gradient(circle at 50% 0%, rgba(196,160,86,.18), transparent 42%), linear-gradient(#fbf3e4, #f7ead3);
  }
  .plate.king .frame2 {
    background: radial-gradient(circle at 50% 0%, rgba(232,201,106,.35), transparent 46%), linear-gradient(#3a1418, #6b1c2a);
    color: #f8e7c4; border-color: #e8c96a;
  }
  .orn { position: absolute; width: 54px; height: 54px; color: var(--gold); opacity: .9; }
  .orn.tl { top: 6px; left: 6px; }
  .orn.tr { top: 6px; right: 6px; transform: scaleX(-1); }
  .orn.bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
  .orn.br { bottom: 6px; right: 6px; transform: scale(-1); }
  .kicker {
    font-family: Cinzel, serif; font-size: clamp(11px, 2.1vw, 15px);
    letter-spacing: .28em; text-transform: uppercase; color: var(--wine); margin: 0;
  }
  .plate.king .kicker { color: #ffe9a3; }
  .kicker em {
    font-family: "Great Vibes", cursive; font-style: normal; font-size: 1.7em;
    letter-spacing: 0; text-transform: none; color: var(--gold); padding: 0 8px;
  }
  .date {
    margin: 4px 0 0; font-size: clamp(12px, 2vw, 15px); letter-spacing: .22em;
    text-transform: uppercase; color: var(--muted);
  }
  .plate.king .date { color: #e8d5a3; }
  .rule { width: 120px; height: 1px; background: var(--gold); margin: 12px auto 10px; position: relative; }
  .rule:before, .rule:after {
    content: ""; position: absolute; top: -3px; width: 7px; height: 7px;
    border: 1px solid var(--gold); transform: rotate(45deg); background: var(--ivory);
  }
  .plate.king .rule:before, .plate.king .rule:after { background: #6b1c2a; }
  .rule:before { left: -8px; }
  .rule:after { right: -8px; }
  .seal {
    width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--gold);
    box-shadow: inset 0 0 0 5px var(--wine), 0 0 0 1px var(--gold2);
    background: var(--wine2); color: #f8e7c4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 4px auto 12px;
  }
  .plate.bridal .seal { background: #7a1f32; box-shadow: inset 0 0 0 5px #7a1f32, 0 0 0 1px var(--gold2); }
  .plate.king .seal {
    background: #e8c96a; color: #4a101b;
    box-shadow: inset 0 0 0 5px #c4a056, 0 0 0 1px #fff3c4;
  }
  .seal span { font-family: Cinzel, serif; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; opacity: .8; }
  .seal strong { font-family: Cinzel, serif; font-size: 28px; line-height: 1; font-weight: 700; }
  .guests { list-style: none; margin: 0; padding: 0; }
  .guests li { font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; line-height: 1.15; color: var(--wine2); }
  .plate.king .guests li { color: #ffe9a3; }
  .guests li + li { margin-top: 4px; }
  .guests.triple li { font-size: clamp(18px, 2.8vw, 28px); }
  .guests li.amp {
    font-family: "Great Vibes", cursive; color: var(--gold);
    font-size: 22px; font-weight: 400; line-height: 1; margin: 2px 0;
  }
  .foot {
    margin: 12px 0 0; font-family: Cinzel, serif; font-size: 10px;
    letter-spacing: .26em; text-transform: uppercase; color: var(--muted);
  }
  .plate.bridal .foot { color: var(--wine); }
  .plate.king .foot { color: #ffe9a3; }
  .plate-crown { width: 54px; height: 36px; margin-bottom: 4px; color: #e8c96a; }
  .floor-banner {
    font-family: Cinzel, serif; letter-spacing: .14em; text-transform: uppercase;
    background: var(--wine2); color: #f8e7c4; text-align: center;
    padding: 12px; border-radius: 14px; margin: 8px 0 4px;
  }

  @media (max-width: 860px) {
    html { -webkit-text-size-adjust: 100%; }
    .no-print { padding: 14px 12px calc(92px + env(safe-area-inset-bottom)); }
    .no-print h1 { font-size: 16px; }
    .actions button, .actions a { width: 100%; text-align: center; }
    .floor-num { font-size: 28px; min-width: 34px; }
    .floor-head { gap: 10px; padding: 10px 12px; }
    .floor-head h2 { font-size: 13px; }
    .floor-head p { font-size: 12px; }
    .floor-head .lock { font-size: 9px; padding: 5px 8px; }
    .corridor { grid-template-columns: 1fr; align-items: stretch; padding: 10px; }
    .door, .r04, .r03, .r02, .r01, .r00 {
      min-height: 0; transform: none; padding: 10px 12px; border-radius: 12px;
      display: flex; flex-direction: row; flex-wrap: wrap; align-items: center;
      justify-content: flex-start; text-align: left; gap: 4px 10px;
    }
    .crown { width: 20px; height: 14px; margin: 0; }
    .door .no { font-size: 20px !important; }
    .door .who { flex: 1; min-width: 0; margin: 0; font-size: 15px; }
    .door .tag { flex-basis: 100%; margin: 2px 0 0; padding: 0; text-align: left; font-size: 8px; }
    .plates { padding: 8px 12px calc(92px + env(safe-area-inset-bottom)); }
    .plate { aspect-ratio: 1.15 / 1; }
    .guests li { font-size: 20px; }
  }
  @media (min-width: 861px) {
    .tabbar { display: none; }
  }
  @media print {
    @page { size: A4 portrait; margin: 9mm; }
    .no-print, .tabbar { display: none !important; }
    body { background: #fff; }
    .plates { display: block; padding: 0; max-width: none; }
    .floor-banner { display: none !important; }
    .plate {
      width: 192mm; height: 132mm; margin: 0 auto 8mm;
      box-shadow: none; break-inside: avoid; page-break-inside: avoid; aspect-ratio: auto;
    }
    .plate:nth-of-type(even) { margin-bottom: 0; }
    .kicker { font-size: 15px; }
    .date { font-size: 13px; }
    .guests li { font-size: 32px; }
    .guests.triple li { font-size: 26px; }
    .seal { width: 98px; height: 98px; }
    .seal strong { font-size: 32px; }
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
</style>
</head>
<body>
<div class="no-print">
  <h1>Noor weds Raghib</h1>
  <p>Each floor is a hotel corridor. Best room is always <b>x04</b> (like 504), then 03, 02, 01, 00.</p>
  <p class="legend"><b>Gold tall door</b> = best on that floor · <b>Couple suite</b> = 504 · <b>King</b> = Najmul Huda, 104</p>
  <div class="actions">
    <button type="button" onclick="window.print()">Print door plates</button>
    <a href="/return">Return train list</a>
    <a href="/barat">Going train list</a>
  </div>
  <div id="pending"></div>
  <div class="hotel" id="hotel"></div>
</div>
<div class="plates" id="plates"></div>
<script>
const ROOMS = [
  { n: "504", ok: true, people: ["Raghib Najmi", "Afifa Noor"], bridal: true },
  { n: "503", ok: true, people: ["Taazeem Najmi"] },
  { n: "502", ok: true, people: ["Amin Huda", "Shagufta"] },
  { n: "501", ok: true, people: ["Shakil Ahmed", "Shaheena"] },
  { n: "500", ok: true, people: ["Aqil Ahmed", "Rehana Begum"] },
  { n: "404", ok: true, people: ["Aman Dev", "Sayem Kalim"] },
  { n: "403", ok: true, people: ["Md Kamil", "Rahbar Shifat"] },
  { n: "402", ok: true, people: ["Rooman Alam", "Abu Noman Khan"] },
  { n: "401", ok: true, people: ["Masood Raghib", "Ashif Alam"] },
  { n: "400", ok: true, people: ["Kashif Ashiqui", "Shazi (Ayan Kumar)", "Salman"] },
  { n: "304", ok: true, people: ["Salhaddin", "Quiser Imam"] },
  { n: "303", ok: true, people: ["Aziz Huda", "Parwez Alam"] },
  { n: "302", ok: true, people: ["Zainul Abadeen", "Tabish Hayat"] },
  { n: "301", ok: true, people: ["Md Nasim", "Soeb Raza"] },
  { n: "300", ok: true, people: ["Faisal Shakeel", "Faizan Ahmed"] },
  { n: "204", ok: true, people: ["Tabrez Hayat", "Minhajul Abeden"] },
  { n: "203", ok: true, people: ["Sajidul Huda", "Imranul Huda"] },
  { n: "202", ok: true, people: ["Shahwaz Anis", "Anwar Ul Haque"] },
  { n: "201", ok: true, people: ["Mohd Alam", "Manahil Alam"] },
  { n: "200", ok: true, people: ["Fahim Huda", "Sajiadul Arfan"] },
  { n: "104", ok: true, people: ["Najmul Huda", "Israr Rafique"], king: true },
  { n: "103", ok: true, people: ["Mumtaz", "Farghab Saud (Sartaj)"] },
  { n: "102", ok: true, people: ["Manir Huda", "Mazhar Hussain"] },
  { n: "101", ok: true, people: ["Zia Ashraf", "Tanweer Asraf"] },
  { n: "100", ok: true, people: ["Md Shakeel (Samo)", "Owais"] },
  { n: "001", ok: true, people: ["Modassir Barkat", "Sarwar Alam", "Md Seraj"] },
  { n: "000", ok: true, vacant: true, people: [] }
];

const PENDING = [];

const corner = `
<svg class="orn" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <path d="M8 48 Q8 8 48 8" stroke="currentColor" stroke-width="1.6"/>
  <path d="M16 48 Q16 16 48 16" stroke="currentColor" stroke-width="1"/>
  <circle cx="14" cy="14" r="2.2" fill="currentColor"/>
  <path d="M22 10 C26 18 34 18 38 10" stroke="currentColor" stroke-width="1"/>
</svg>`;

const crown = `<svg class="crown" viewBox="0 0 64 40" fill="currentColor" aria-hidden="true"><path d="M6 34h52l-4-18-12 10L32 6 22 26 10 16 6 34z"/><circle cx="10" cy="14" r="3"/><circle cx="32" cy="5" r="3.4"/><circle cx="54" cy="14" r="3"/><rect x="8" y="32" width="48" height="6" rx="1"/></svg>`;
const plateCrown = crown.replace('class="crown"', 'class="plate-crown"');

const FLOORS = [
  { id: 5, title: "5th floor", ordinal: "5" },
  { id: 4, title: "4th floor", ordinal: "4" },
  { id: 3, title: "3rd floor", ordinal: "3" },
  { id: 2, title: "2nd floor", ordinal: "2" },
  { id: 1, title: "1st floor", ordinal: "1" },
  { id: 0, title: "Extra rooms", ordinal: "0" }
];

function floorOf(n) { return Number(String(n).padStart(3, "0")[0]); }
function rank(n) { return "r" + String(n).padStart(3, "0").slice(-2); }
function tag(r) {
  if (r.bridal) return "The Couple";
  if (r.king) return "Father of the Groom";
  if (r.vacant) return "Vacant";
  if (r.pending) return "New room · number TBD";
  if (String(r.n).padStart(3, "0").endsWith("04")) return "Best on floor";
  return "Baraat Stay";
}
function names(people, king, vacant) {
  if (vacant || !people.length) return "Vacant";
  return people.map(p => {
    if (king && p === "Najmul Huda") return "♛ " + p;
    return p;
  }).join("<br>");
}
function plateHtml(r) {
  const lis = r.vacant || !r.people.length
    ? `<li>Vacant</li>`
    : r.people.length === 2
      ? `<li>${r.king ? "♛ " : ""}${r.people[0]}</li><li class="amp" aria-hidden="true">&amp;</li><li>${r.people[1]}</li>`
      : r.people.map(p => `<li>${p}</li>`).join("");
  const cls = `plate ${r.pending ? "pending" : rank(r.n)}${r.bridal ? " bridal" : ""}${r.king ? " king" : ""}${r.vacant ? " vacant" : ""}`;
  return `
  <article class="${cls}">
    <div class="frame"><div class="frame2">
      ${corner.replace('class="orn"', 'class="orn tl"')}
      ${corner.replace('class="orn"', 'class="orn tr"')}
      ${corner.replace('class="orn"', 'class="orn bl"')}
      ${corner.replace('class="orn"', 'class="orn br"')}
      ${r.king || r.bridal ? plateCrown : ""}
      <p class="kicker">Noor <em>weds</em> Raghib</p>
      <p class="date">15 November 2026</p>
      <div class="rule"></div>
      <div class="seal"><span>Room</span><strong>${r.n}</strong></div>
      <ul class="guests${r.people.length > 2 ? " triple" : ""}">${lis}</ul>
      <p class="foot">${tag(r)}</p>
    </div></div>
  </article>`;
}

document.getElementById("pending").innerHTML = PENDING.length ? `
  <section class="pending-block">
    <div class="pending-head">
      <h2>New room · number pending</h2>
      <p>Moved out of 404 for now — assign a room number when ready.</p>
    </div>
    ${PENDING.map(r => `
      <div class="pending-row">
        <div class="room-no">${r.n}</div>
        <div class="who">${r.people.join(" · ")}</div>
      </div>
    `).join("")}
  </section>` : "";

document.getElementById("hotel").innerHTML = FLOORS.map(f => {
  const rooms = ROOMS.filter(r => floorOf(r.n) === f.id);
  const doors = rooms.map(r => `
    <article class="door ${rank(r.n)}${r.bridal ? " couple" : ""}${r.king ? " king" : ""}${r.vacant ? " vacant" : ""}">
      ${r.king || r.bridal ? crown : ""}
      <div class="badge no">${r.n}</div>
      <div class="who">${names(r.people, r.king, r.vacant)}</div>
      <div class="tag">${tag(r)}</div>
    </article>
  `).join("");
  const locked = rooms.filter(r => r.ok && !r.vacant).length;
  return `
    <section class="floor">
      <div class="floor-head">
        <div class="floor-num">${f.ordinal}</div>
        <div>
          <h2>${f.title}</h2>
          <p>Rooms ${rooms[0].n} → ${rooms[rooms.length - 1].n}</p>
        </div>
        <div class="lock">${locked} / ${rooms.length} filled</div>
      </div>
      <div class="corridor">${doors}</div>
    </section>`;
}).join("");

const pendingPlates = PENDING.map(r => plateHtml({ ...r, pending: true })).join("");
const floorPlates = FLOORS.map(f => {
  const rooms = ROOMS.filter(r => floorOf(r.n) === f.id);
  return `<div class="floor-banner">${f.title} · best room ${rooms[0].n}</div>${rooms.map(plateHtml).join("")}`;
}).join("");
document.getElementById("plates").innerHTML =
  (PENDING.length ? `<div class="floor-banner">New room · number TBD</div>${pendingPlates}` : "") + floorPlates;
</script>

</nav>
