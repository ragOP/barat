<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baraat Train List — 15 Nov 2026</title>
<style>
  :root {
    --ink: #121826;
    --muted: #5b6475;
    --paper: #ece7dc;
    --navy: #1b3a6b;
    --navy2: #12284d;
    --red: #b42318;
    --veg: #157347;
    --line: #d7d0c2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; }
  .app {
    display: grid;
    grid-template-columns: 1fr;
    min-height: 100vh;
  }
  aside {
    background: #f7f3ea;
    border-bottom: 1px solid var(--line);
    padding: 14px;
  }
  .count-row {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 12px;
  }
  .count-box {
    min-width: 92px;
    background: var(--navy);
    color: #fff;
    border-radius: 16px;
    padding: 12px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  .count-box strong { display: block; font-size: 34px; line-height: 1; }
  .count-box span { display: block; margin-top: 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  .count-box em { display: block; margin-top: 6px; font-style: normal; font-size: 12px; color: #f3d27a; }
  .search-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  input[type="search"], select {
    width: 100%;
    height: 44px;
    border: 1.5px solid #cfc7b8;
    border-radius: 12px;
    padding: 0 12px;
    font-size: 15px;
    background: #fff;
    color: var(--ink);
  }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters label, .sort-row label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 4px;
  }
  .break {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .break div {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
  }
  .break b { display: block; font-size: 16px; }
  .break span { font-size: 11px; color: var(--muted); }
  main { padding: 14px 14px 80px; }
  .board {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: var(--navy2);
    color: #fff;
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .board b { display: block; font-size: 16px; }
  .board small { opacity: .75; }
  .list { display: grid; gap: 12px; }
  .ticket {
    background: #fffef9;
    border: 1.5px solid #1b3a6b;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 3px 4px 0 rgba(18,40,77,.12);
  }
  .t-top {
    background: var(--navy);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .t-top .cnf {
    background: #e8f8ee;
    color: var(--veg);
    border-radius: 999px;
    padding: 3px 8px;
    font-weight: 800;
    letter-spacing: 0;
  }
  .t-body { padding: 12px; }
  .route {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 6px;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px dashed #cfc7b8;
  }
  .route .st { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .route b { display: block; font-size: 18px; }
  .route .time { color: var(--navy); }
  .route .mid { text-align: center; color: var(--navy); font-weight: 800; }
  .who {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0 8px;
  }
  .who h3 { margin: 0; font-size: 18px; line-height: 1.15; }
  .who .final { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .badge {
    min-width: 86px;
    text-align: center;
    background: #13284d;
    color: #fff;
    border-radius: 12px;
    padding: 8px 8px 7px;
  }
  .badge b { display: block; font-size: 18px; }
  .badge span { font-size: 10px; letter-spacing: .04em; opacity: .8; }
  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .facts div {
    background: #f4efe4;
    border-radius: 10px;
    padding: 7px 8px;
  }
  .facts label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .facts b { font-size: 12px; }
  .meal-v { color: var(--veg); }
  .meal-n { color: var(--red); }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
  .switch { margin: 0 0 12px; font-size: 13px; }
  .switch a { color: var(--navy); font-weight: 700; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    background: var(--navy2);
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(18,40,77,.2);
  }
  .tabbar a {
    color: rgba(255,255,255,.7); text-align: center; text-decoration: none;
    font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    padding: 11px 6px; border-radius: 12px;
  }
  .tabbar a.on { background: rgba(255,255,255,.14); color: #fff; }
  @media (max-width: 859px) {
    html { -webkit-text-size-adjust: 100%; }
    aside { padding: 12px 12px 8px; }
    main { padding: 12px 12px calc(92px + env(safe-area-inset-bottom)); }
    .count-box { min-width: 78px; padding: 10px 8px; }
    .count-box strong { font-size: 28px; }
    input[type="search"], select { font-size: 16px; height: 42px; }
    .filters { grid-template-columns: 1fr 1fr; }
    .board { flex-wrap: wrap; font-size: 12px; padding: 10px 12px; }
    .board b { font-size: 14px; }
    .switch { display: none; }
    .who { align-items: flex-start; }
    .who h3 { font-size: 16px; word-break: break-word; }
    .badge { min-width: 76px; }
    .facts { grid-template-columns: 1fr 1fr; }
    .facts b { word-break: break-word; font-size: 12px; }
    .t-top { font-size: 10px; }
  }
  @media (min-width: 860px) {
    .app { grid-template-columns: 280px 1fr; }
    aside {
      border-bottom: 0;
      border-right: 1px solid var(--line);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .count-row { flex-direction: column; }
    .count-box { min-width: 0; padding: 18px 12px; }
    .count-box strong { font-size: 56px; }
    .filters { grid-template-columns: 1fr; }
    .list { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    main { padding: 18px 22px 50px; }
    .tabbar { display: none; }
  }
</style>
</head>

    seat: (a,b) => a.coach.localeCompare(b.coach, undefined, {numeric:true}) || a.seat - b.seat,
    name: (a,b) => a.ticket.localeCompare(b.ticket),
    pnr: (a,b) => a.pnr.localeCompare(b.pnr) || a.seat - b.seat,
    from: (a,b) => a.dep.localeCompare(b.dep) || a.coach.localeCompare(b.coach) || a.seat - b.seat,
    age: (a,b) => a.age - b.age,
    meal: (a,b) => a.meal.localeCompare(b.meal) || a.ticket.localeCompare(b.ticket)
  };
  return out.sort(cmp[sort] || cmp.seat);
}

function render() {
  const data = rows();
  const pnrs = new Set(data.map(r => r.pnr));
  document.getElementById("shown").textContent = data.length;
  document.getElementById("total").textContent = ROWS.length;
  document.getElementById("pnrShown").textContent = pnrs.size + " PNRs";
  document.getElementById("cLKR").textContent = data.filter(r => r.code === "LKR").length;
  document.getElementById("cPNBE").textContent = data.filter(r => r.code === "PNBE").length;
  document.getElementById("cASN").textContent = data.filter(r => r.code === "ASN").length;
  document.getElementById("empty").hidden = data.length > 0;
  document.getElementById("list").innerHTML = data.map(r => `
    <article class="ticket">
      <div class="t-top">
        <span>Electronic Reservation Slip</span>
        <span class="cnf">${r.pnr === "PENDING" ? "TO BOOK" : "CNF"}</span>
      </div>
      <div class="t-body">
        <div class="route">
          <div>
            <div class="st">From · ${r.date}</div>
            <b>${r.st}</b>
            <div class="time">${r.dep}</div>
          </div>
          <div class="mid">→</div>
          <div style="text-align:right">
            <div class="st">To · Howrah</div>
            <b>HWH</b>
            <div class="time">${r.arr}</div>
          </div>
        </div>
        <div class="who">
          <div>
            <h3>${r.ticket}</h3>
            <p class="final">Final list name: ${r.final}</p>
          </div>
          <div class="badge"><b>${r.coach}-${r.seat}</b><span>${r.pref}</span></div>
        </div>
        <div class="facts">
          <div><label>PNR</label><b>${r.pnr}</b></div>
          <div><label>Age / Gender</label><b>${r.age} / ${r.gender === "F" ? "Female" : "Male"}</b></div>
          <div><label>Meal</label><b class="${r.meal === "VEG" ? "meal-v" : "meal-n"}">${r.meal}</b></div>
          <div><label>Coach / Seat</label><b>${r.coachSeat}</b></div>
          <div><label>Class</label><b>Chair Car (CC)</b></div>
          <div><label>Train</label><b>22348 VB</b></div>
        </div>
      </div>
    </article>
  `).join("");
}

["q","sort","from","coach","meal","gender"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
render();
</script>
</body>
